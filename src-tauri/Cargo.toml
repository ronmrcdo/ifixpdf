[package]
name = "ifixpdf"
version = "0.1.0"
description = "iFixPDF PDF workspace"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-opener = "=2.7.2"
serde_json = "1"
